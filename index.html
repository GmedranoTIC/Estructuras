<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Cargo Bridge</title>
    <meta name="description" content="Juego clásico de física y construcción de puentes con controles táctiles adaptados, simulación de estrés y compatible con GitHub Pages." />
    <meta property="og:title" content="Estructuras para puentes" />
    <meta property="og:description" content="Juego clásico de física y construcción de puentes con controles táctiles adaptados, simulación de estrés y compatible con GitHub Pages." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Favicon para navegadores modernos, iOS y compatibilidad universal -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f172a'/%3E%3Cpath d='M3 22 L11 10 L21 10 L29 22 Z' stroke='%23f59e0b' stroke-width='2.2' fill='none' stroke-linejoin='round'/%3E%3Cline x1='11' y1='10' x2='16' y2='22' stroke='%23f59e0b' stroke-width='1.8'/%3E%3Cline x1='21' y1='10' x2='16' y2='22' stroke='%23f59e0b' stroke-width='1.8'/%3E%3Cline x1='1' y1='22' x2='31' y2='22' stroke='%2338bdf8' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./favicon.ico" />
    <script>
      // Asegurar barra diagonal final en GitHub Pages (ej. /repo -> /repo/)
      // para que las rutas relativas a ./assets/ funcionen en cualquier subcarpeta
      (function() {
        var p = window.location.pathname;
        if (p.length > 1 && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </head>
  <body class="overflow-hidden bg-[#1e293b] select-none touch-none">
    <div id="root">
      <div class="loading-spinner-wrap" style="display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#cbd5e1;font-family:system-ui,sans-serif;text-align:center;padding:24px;">
        <div style="width:48px;height:48px;border:3px solid #334155;border-top-color:#f59e0b;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;"></div>
        <h2 style="color:#f59e0b;font-size:20px;font-weight:bold;margin:0 0 8px 0;">Cargando el juego para construir puentes...</h2>
        <p style="font-size:13px;color:#94a3b8;max-width:420px;margin:0;line-height:1.5;">Estructuras ESO • @GmedranoTIC</p>
        <div id="loading-error-box" style="display:none;margin-top:16px;padding:12px 16px;background:#450a0a;color:#fca5a5;border:1px solid #ef4444;border-radius:12px;font-size:13px;max-width:440px;line-height:1.5;box-shadow:0 10px 25px -5px rgba(0,0,0,0.5);"></div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Soporte universal resiliente para GitHub Pages:
      // Cuando se ejecuta en GitHub Pages (sin servidor Vite activo), los navegadores
      // no ejecutan archivos TypeScript (.tsx) directamente.
      // Si a los 250ms React no ha montado, intentamos cargar los bundles compilados
      // verificando las rutas posibles: ./assets/app.js, ./docs/assets/app.js o el bundle en docs.
      (function() {
        var v = '?v=' + Date.now();
        var candidateStyles = [
          './assets/app.css',
          './docs/assets/app.css',
          './docs/assets/index-BtW3Qb34.css'
        ];
        var candidateScripts = [
          './assets/app.js',
          './docs/assets/app.js',
          './docs/assets/index-CwnglBNx.js'
        ];

        function checkAndFallback() {
          var root = document.getElementById('root');
          if (!root || !root.querySelector('.loading-spinner-wrap')) {
            return;
          }

          console.log('[GitHub Pages] Verificando bundles de producción...');
          
          // Inyectar hojas de estilo candidatas
          candidateStyles.forEach(function(href) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href + v;
            document.head.appendChild(link);
          });

          // Carga secuencial resiliente del script
          var currentIdx = 0;
          function tryNextScript() {
            if (currentIdx >= candidateScripts.length) {
              console.error('No se pudo cargar ningún bundle de scripts.');
              var errBox = document.getElementById('loading-error-box');
              if (errBox) {
                errBox.style.display = 'block';
                errBox.innerHTML = '<strong>No se pudo cargar el juego:</strong><br>' +
                  '<span style="font-size:12px;color:#fca5a5;">' +
                  'No se encontró ni <code>assets/app.js</code> ni <code>docs/assets/app.js</code> en el repositorio.<br><br>' +
                  '• <strong>Opción 1:</strong> Sube la carpeta <code>assets</code> a la raíz de tu repositorio.<br>' +
                  '• <strong>Opción 2:</strong> En los ajustes de tu repositorio (Settings &gt; Pages), cambia Source a <strong>Branch: main / Folder: /docs</strong>.' +
                  '</span>';
              }
              return;
            }

            var src = candidateScripts[currentIdx++];
            console.log('[GitHub Pages] Intentando cargar script:', src);

            var script = document.createElement('script');
            script.type = 'module';
            script.src = src + v;
            script.onload = function() {
              console.log('[GitHub Pages] Bundle cargado con éxito desde:', src);
            };
            script.onerror = function() {
              console.warn('[GitHub Pages] No disponible en:', src + ', intentando siguiente ruta...');
              script.remove();
              tryNextScript();
            };
            document.body.appendChild(script);
          }

          tryNextScript();
        }

        setTimeout(checkAndFallback, 250);
      })();
    </script>
  </body>
</html>
